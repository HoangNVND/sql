server.port: 1999
spring:
  application:
    name: demo
  datasource:
    url: jdbc:mysql://localhost:3307/mydb
    username: viethoangn
    password: viethoangn
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true  # Định dạng câu lệnh SQL cho dễ đọc
logging:
  level:
    org.hibernate.SQL: DEBUG  # Hiển thị câu lệnh SQL
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # Hiển thị giá trị tham số bind